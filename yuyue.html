<style>

.submit-bar.has{background:#E8F4F5}.submit-hint{font-size:14px;color:var(--t2)}.submit-count{font-size:14px;color:var(--t)}

.btn-load{opacity:.6;pointer-events:none}
.booking-tabs{display:flex;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #ECF0F1}

.adm-l{flex:1}.adm-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}.adm-loc{font-size:12px;color:var(--t2);margin-top:4px}
.adm-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.adm-st{font-size:11px;padding:4px 12px;border-radius:12px;font-weight:600}
.adm-st.act{background:#E8F5E9;color:#27AE60}.adm-st.mt{background:#FFF3E0;color:#F39C12}.adm-st.br{background:#FFEBEE;color:#E74C3C}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}

.modal-sheet{width:100%;max-width:520px;max-height:85vh;background:#fff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,12px);animation:su .25s;overflow-y:auto}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #ECF0F1}
.modal-title{font-size:18px;font-weight:700}.modal-close{font-size:24px;color:var(--t2);cursor:pointer;padding:4px 8px}
.modal-bd{padding:20px}.modal-ft{display:flex;gap:12px;padding:14px 20px;border-top:1px solid #ECF0F1}
.modal-ft .btn{flex:1;padding:14px;border-radius:24px;font-size:15px;text-align:center;cursor:pointer;border:none;font-weight:600}
.btn-cancel{background:#ECF0F1;color:var(--t2)}.btn-confirm{background:var(--c1);color:#fff}.btn-confirm.danger{background:var(--r)}
.fg{margin-bottom:18px}.fg-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.fg-input{width:100%;height:44px;padding:0 14px;border:2px solid #ECF0F1;border-radius:12px;font-size:15px;background:#FAFAFA;outline:none;transition:border .15s}
.fg-input:focus{border-color:var(--c1);background:#fff}.fg-input.err{border-color:var(--r);background:#FFF5F5}
.fg-err{font-size:12px;color:var(--r);margin-top:4px;display:none}
.st-options{display:flex;flex-direction:column;gap:10px}
.st-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:#FAFAFA;border:2px solid transparent;cursor:pointer;font-size:14px;transition:.15s}
.st-opt.sel{border-color:var(--c1);background:#E8F4F5}.st-dot{width:20px;height:20px;border-radius:50%;border:2px solid #BDC3C7;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.st-dot.chk{border-color:var(--c1)}.st-dot.chk::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--c1)}
.warn-box{display:flex;gap:12px;padding:16px;background:#FFF8E1;border-radius:12px;border-left:4px solid #F39C12;margin-top:8px;font-size:13px}
.warn-ico{font-size:28px;flex-shrink:0}.warn-ttl{font-weight:700;color:#E67E22;display:block;margin-bottom:4px}
.warn-list{margin-top:8px}.warn-list li{color:#795548;font-size:12px;padding:2px 0}
#toast-container{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:12px 24px;border-radius:24px;font-size:14px;font-weight:500;color:#fff;pointer-events:auto;animation:ti .3s,to .3s 2s forwards;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.info{background:#333}.toast.ok{background:var(--g)}.toast.err{background:var(--r)}
@keyframes ti{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes to{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
#loader{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center}#loader.hide{display:none}
.spin{width:36px;height:36px;border:3px solid #E0E6E7;border-top-color:var(--c1);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:520px){.slot-card{width:calc((100% - 30px)/4)}.inst-chip{width:calc((100% - 20px)/3)}}
@media(max-width:360px){.slot-card{width:calc((100% - 10px)/2)}.inst-chip{width:100%}}
</style>

<body>
<div id="loader"><div class="spin"></div><div style="font-size:14px;color:var(--t2)">加载中…</div></div>
<div id="app"></div>
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ==================== Supabase 初始化 ====================
var SUPABASE_URL = "https://xnayjzwkailupwjsjpvr.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuYXlqendrYWlsdXB3anNqcHZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MzA0NTMsImV4cCI6MjA5NjIwNjQ1M30.V61HUqbFEQULhsrMA0Drzfuvl8QH_A6SEoC8Qy8HhUA";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==================== 北京时间工具 ====================
// 直接用浏览器本地时间（中国用户本地时区=UTC+8=北京时间）
function bjNow(){return new Date()}
function fmD(d,f){var m={YYYY:d.getFullYear(),MM:String(d.getMonth()+1).padStart(2,'0'),DD:String(d.getDate()).padStart(2,'0'),HH:String(d.getHours()).padStart(2,'0'),mm:String(d.getMinutes()).padStart(2,'0')};return f.replace(/YYYY|MM|DD|HH|mm/g,function(k){return m[k]})}
function tdy(){return fmD(bjNow(),'YYYY-MM-DD')}
function i530(){var d=bjNow();return d.getHours()>17||(d.getHours()===17&&d.getMinutes()>=30)}
function iTmr(s){var t=new Date();t.setDate(t.getDate()+1);return s===fmD(t,'YYYY-MM-DD')}
function wkZh(s){return['周日','周一','周二','周三','周四','周五','周六'][new Date(s+'T12:00:00+08:00').getDay()]}
function sUTC(ds,ts){var h=ts.split(':').map(Number);return Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10),h[0]-8,h[1])}
function iExp(ds,ts){return Date.now()>sUTC(ds,ts)}

// ==================== Toast / Loader / Modal ====================
function toast(m,t){t=t||'info';var c=document.getElementById('toast-container'),e=document.createElement('div');e.className='toast '+t;e.textContent=m;c.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},2500)}
function ld(s){var l=document.getElementById('loader');l.classList.remove('hide');l.lastChild.textContent=s||'加载中…'}
function unld(){document.getElementById('loader').classList.add('hide')}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\\/g,'&#92;')}
function showModal(o){var c=document.getElementById('modal-container');c.innerHTML='<div class="modal-overlay" id="mo"><div class="modal-sheet"><div class="modal-hd"><span class="modal-title">'+esc(o.title||'')+'</span><span class="modal-close" id="mc">✕</span></div><div class="modal-bd">'+(o.body||'')+'</div>'+(o.footer!==false?'<div class="modal-ft">'+(o.footer||'')+'</div>':'')+'</div></div>';document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeModal()});document.getElementById('mc').addEventListener('click',closeModal);if(o.onShow)o.onShow()}
function closeModal(){document.getElementById('modal-container').innerHTML=''}

// ==================== 数据层 ====================
var cache={insts:[],resvs:[]};
var UID='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{var sUid=localStorage.getItem('qPCR_uid');if(sUid)UID=sUid;else localStorage.setItem('qPCR_uid',UID)}catch(e){}

async function loadInsts(){var r=await sb.from('instruments').select('*').order('status',{ascending:true});if(!r.error)cache.insts=r.data;return cache.insts}
async function loadResvs(){var r=await sb.from('reservations').select('*').eq('status','active').order('date',{ascending:true}).limit(500);if(!r.error)cache.resvs=r.data;return cache.resvs}
async function loadMyResvs(){var r=await sb.from('reservations').select('*').eq('user_id',UID).order('date',{ascending:false}).limit(200);return r.error?[]:r.data}

// ==================== 状态 ====================
var S={page:'booking',selDate:tdy(),today:tdy(),selInst:'',slots:[],checked:[],s530:false,instSt:'active',dr:null,btab:'active'};

// ==================== 渲染 ====================
function h(t,a,c){var e=document.createElement(t);if(a)for(var k in a){if(k==='className')e.className=a[k];else if(k==='style'){if(typeof a[k]==='string')e.style.cssText=a[k];else Object.assign(e.style,a[k])}else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),a[k]);else if(k==='text')e.textContent=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k])}if(c){if(typeof c==='string'||typeof c==='number')e.textContent=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}

function render(){var a=document.getElementById('app');a.innerHTML='';a.appendChild(rNav());if(S.page==='booking')a.appendChild(rBook());else if(S.page==='mybookings')a.appendChild(rMy());else if(S.page==='admin')a.appendChild(rAdm());a.appendChild(rBar())}

function rNav(){var n=cache.resvs.filter(function(r){return r.user_id===UID&&r.status==='active'&&!iExp(r.date,r.start_time)}).length;return h('div',{className:'nav-bar'},[h('div',{className:'nav-item'+(S.page==='booking'?' on':''),onclick:function(){S.page='booking';cSlots();render()}},'预约仪器'),h('div',{className:'nav-item'+(S.page==='mybookings'?' on':''),onclick:async function(){S.page='mybookings';ld('加载预约…');cache.myResvs=await loadMyResvs();unld();render()}},['我的预约',n>0?h('span',{className:'nav-badge',text:String(n)}):null]),h('div',{className:'nav-item'+(S.page==='admin'?' on':''),onclick:goAdmin},'仪器管理')])}

function rBook(){
  var insts=cache.insts;if(!S.selInst&&insts.length)S.selInst=insts[0].id;
  cSlots();
  var dl=[],sd=new Date(S.today);
  for(var i=0;i<7;i++){var d=new Date(sd.getTime()+i*86400000),ds=fmD(d,'YYYY-MM-DD'),p=ds.split('-');dl.push({ds:ds,day:parseInt(p[1])+'/'+parseInt(p[2]),wk:wkZh(ds)})}
  var w=h('div',{className:'page active'});
  w.appendChild(h('div',{className:'cal-wrap'},h('div',{className:'cal-row'},dl.map(function(dd){var cl='day-chip';if(dd.ds===S.today)cl+=' today';if(dd.ds===S.selDate)cl+=' on';return h('div',{className:cl,onclick:function(){S.selDate=dd.ds;S.checked=[];cSlots();render()}},[h('span',{className:'dw',text:dd.wk}),h('span',{className:'dn',text:dd.day})])}))));
